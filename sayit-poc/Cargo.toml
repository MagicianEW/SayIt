[workspace]
resolver = "2"
members = [
    "crates/sayit-drm",
    "crates/sayit-edge",
    "crates/sayit-poc-bin",
    "crates/sayit-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/local/sayit"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.24"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
bytes = "1.7"
hex = "0.4"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"