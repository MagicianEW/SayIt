name: Release Builds

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  RUST_BACKTRACE: 1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Install macOS dependencies
        run: |
          cd apps/sayit_app
          flutter precache --macos

      - name: Build macOS
        run: |
          cd apps/sayit_app
          flutter build macos --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin
          cp sayit-poc/target/release/sayit-poc apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/
          chmod +x apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/sayit-poc

      - name: Create DMG
        run: |
          cd apps/sayit_app/build/macos/Build/Products/Release
          mkdir -p SayIt_dmg
          cp -R SayIt.app SayIt_dmg/
          brew install create-dmg
          create-dmg \
            --volname "SayIt" \
            --window-pos 200 120 \
            --hide-extension SayIt.app \
            "SayIt_macos_${{ github.event.inputs.tag || github.event.release.tag_name }}.dmg" \
            "SayIt_dmg/"

      - name: Upload to Release
        if: github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} apps/sayit_app/build/macos/Build/Products/Release/SayIt_macos_${{ github.event.inputs.tag }}.dmg --clobber

      - name: Upload to Release (release trigger)
        if: github.event.inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} apps/sayit_app/build/macos/Build/Products/Release/SayIt_macos_${{ github.event.release.tag_name }}.dmg --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Windows
        run: |
          cd apps/sayit_app
          flutter build windows --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p apps/sayit_app/build/windows/runner/Release/bin
          cp sayit-poc/target/release/sayit-poc.exe apps/sayit_app/build/windows/runner/Release/bin/

      - name: Create ZIP
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.inputs.tag }}' -ne '') { '${{ github.event.inputs.tag }}' } else { '${{ github.event.release.tag_name }}' }
          $zipName = "SayIt_windows_$tag.zip"
          Compress-Archive -Path * -DestinationPath $zipName

      - name: Upload to Release
        if: github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} apps/sayit_app/build/windows/runner/Release/SayIt_windows_${{ github.event.inputs.tag }}.zip --clobber

      - name: Upload to Release (release trigger)
        if: github.event.inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} apps/sayit_app/build/windows/runner/Release/SayIt_windows_${{ github.event.release.tag_name }}.zip --clobber
