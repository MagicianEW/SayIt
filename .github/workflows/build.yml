name: Build & Release

on:
  # 手动触发（测试用）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于 artifact 命名）'
        required: false
        type: string
        default: 'dev'

  # Release 发布时触发（正式发布）
  release:
    types: [published]

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  # workflow_dispatch: input.version; release: event.release.tag_name; fallback: dev
  VERSION: ${{ github.event.inputs.version || github.event.release.tag_name || 'dev' }}

jobs:
  # ── macOS ────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build macOS
        run: |
          cd apps/sayit_app
          flutter build macos --release

      - name: Copy Rust binary into app bundle
        run: |
          mkdir -p apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin
          cp sayit-poc/target/release/sayit-poc \
             apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/
          chmod +x apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/sayit-poc

      - name: Create DMG
        run: |
          cd apps/sayit_app/build/macos/Build/Products/Release
          mkdir -p SayIt_dmg
          cp -R SayIt.app SayIt_dmg/
          brew install create-dmg
          create-dmg \
            --volname "SayIt" \
            --window-pos 200 120 \
            --hide-extension SayIt.app \
            "SayIt_macos_${{ env.VERSION }}.dmg" \
            "SayIt_dmg/"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayIt_macos_${{ env.VERSION }}
          path: apps/sayit_app/build/macos/Build/Products/Release/SayIt_macos_${{ env.VERSION }}.dmg
          retention-days: 14

  # ── Windows ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Windows desktop
        run: |
          flutter config --enable-windows-desktop
          cd apps/sayit_app
          flutter create --platforms=windows --org com.sayit . 2>nul || exit /b 0

      - name: Build Rust binary
        shell: bash
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Windows
        run: |
          cd apps/sayit_app
          flutter build windows --release

      - name: Copy Rust binary into app bundle
        shell: bash
        run: |
          mkdir -p apps/sayit_app/build/windows/runner/Release/bin
          cp sayit-poc/target/release/sayit-poc.exe \
             apps/sayit_app/build/windows/runner/Release/bin/

      - name: Create ZIP
        shell: bash
        run: |
          cd apps/sayit_app/build/windows/runner/Release
          powershell -Command "Compress-Archive -Path * -DestinationPath SayIt_windows_${{ env.VERSION }}.zip -Force"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayIt_windows_${{ env.VERSION }}
          path: apps/sayit_app/build/windows/runner/Release/SayIt_windows_${{ env.VERSION }}.zip
          retention-days: 14

  # ── Linux ───────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
          cd apps/sayit_app
          flutter create --platforms=linux --org com.sayit . 2>&1 | grep -v "^Running \"flutter create\"" || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Linux
        run: |
          cd apps/sayit_app
          flutter build linux --release

      - name: Copy Rust binary into app bundle
        run: |
          mkdir -p apps/sayit_app/build/linux/release/bundle/lib
          cp sayit-poc/target/release/sayit-poc \
             apps/sayit_app/build/linux/release/bundle/lib/

      - name: Create TAR.GZ
        run: |
          cd apps/sayit_app/build/linux/release
          tar -czf SayIt_linux_${{ env.VERSION }}.tar.gz bundle/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayIt_linux_${{ env.VERSION }}
          path: apps/sayit_app/build/linux/release/SayIt_linux_${{ env.VERSION }}.tar.gz
          retention-days: 14

  # ── Release ─────────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: SayIt ${{ github.event.release.tag_name }}
          BODY: |
            ## SayIt v${{ github.event.release.tag_name }}

            本地桌面文本转语音（TTS）工具，支持多语种、多音色。

            ### 下载对应平台的安装包

            | 平台 | 文件 |
            |------|------|
            | macOS | SayIt_macos_${{ github.event.release.tag_name }}.dmg |
            | Windows | SayIt_windows_${{ github.event.release.tag_name }}.zip |
            | Linux | SayIt_linux_${{ github.event.release.tag_name }}.tar.gz |

            ### 前置依赖

            - Python 3.8+ 和 `edge_tts` 模块：`pip install edge_tts`

            ### 已知问题

            - macOS 为临时签名，Gatekeeper 首次会提示"无法验证开发者"，右键打开即可。

        run: |
          # 获取 artifact 实际文件名（VERSION 可能与 tag 不同）
          ARTIFACT_VERSION="${{ github.event.release.tag_name }}"
          echo "发布版本: $ARTIFACT_VERSION"

          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes "$BODY" \
            artifacts/SayIt_macos_*/SayIt_macos_*.dmg \
            artifacts/SayIt_windows_*/SayIt_windows_*.zip \
            artifacts/SayIt_linux_*/SayIt_linux_*.tar.gz
