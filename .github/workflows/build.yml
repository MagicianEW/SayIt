name: Build (Artifacts Only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.2)'
        required: false
        type: string
        default: 'dev'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  VERSION: ${{ github.event.inputs.version || 'dev' }}

jobs:
  # ── macOS ────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build macOS
        run: |
          cd apps/sayit_app
          flutter build macos --release

      - name: Copy Rust binary into app bundle
        run: |
          mkdir -p apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin
          cp sayit-poc/target/release/sayit-poc \
             apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/
          chmod +x apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/sayit-poc

      - name: Create DMG
        run: |
          cd apps/sayit_app/build/macos/Build/Products/Release
          mkdir -p SayIt_dmg
          cp -R SayIt.app SayIt_dmg/
          brew install create-dmg
          create-dmg \
            --volname "SayIt" \
            --window-pos 200 120 \
            --hide-extension SayIt.app \
            "SayIt_macos_${VERSION}.dmg" \
            "SayIt_dmg/"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayIt_macos_${VERSION}
          path: apps/sayit_app/build/macos/Build/Products/Release/SayIt_macos_${VERSION}.dmg
          retention-days: 14

  # ── Windows ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        shell: bash
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Windows
        run: |
          cd apps/sayit_app
          flutter build windows --release

      - name: Copy Rust binary into app bundle
        shell: bash
        run: |
          mkdir -p apps/sayit_app/build/windows/runner/Release/bin
          cp sayit-poc/target/release/sayit-poc.exe \
             apps/sayit_app/build/windows/runner/Release/bin/

      - name: Create ZIP
        shell: bash
        run: |
          cd apps/sayit_app/build/windows/runner/Release
          powershell -Command "Compress-Archive -Path * -DestinationPath SayIt_windows_${VERSION}.zip -Force"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayIt_windows_${VERSION}
          path: apps/sayit_app/build/windows/runner/Release/SayIt_windows_${VERSION}.zip
          retention-days: 14

  # ── Linux ───────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
          cd apps/sayit_app
          flutter create --platforms=linux --org com.sayit . 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang \
            cmake \
            ninja-build \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Linux
        run: |
          cd apps/sayit_app
          flutter build linux --release

      - name: Copy Rust binary into app bundle
        run: |
          mkdir -p apps/sayit_app/build/linux/release/bundle/lib
          cp sayit-poc/target/release/sayit-poc \
             apps/sayit_app/build/linux/release/bundle/lib/

      - name: Create TAR.GZ
        run: |
          cd apps/sayit_app/build/linux/release
          tar -czf SayIt_linux_${VERSION}.tar.gz bundle/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayIt_linux_${VERSION}
          path: apps/sayit_app/build/linux/release/SayIt_linux_${VERSION}.tar.gz
          retention-days: 14
