name: Release Builds

on:
  push:
    tags:
      - 'v*'

env:
  RUST_BACKTRACE: 1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          version: stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Install macOS dependencies
        run: flutter precache --macos

      - name: Build macOS
        run: flutter build macos --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin
          cp sayit-poc/target/release/sayit-poc build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/
          chmod +x build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/sayit-poc

      - name: Create ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r SayIt_macos.zip SayIt.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/SayIt_macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          version: stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Windows
        run: flutter build windows --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p build/windows/runner/Release/data/flutter_assets
          mkdir -p build/windows/runner/Release/bin
          cp sayit-poc/target/release/sayit-poc.exe build/windows/runner/Release/bin/

      - name: Create ZIP
        run: |
          cd build/windows/runner/Release
          Compress-Archive -Path * -DestinationPath SayIt_windows.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/runner/Release/SayIt_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
