name: Release Builds

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Install macOS dependencies
        run: |
          cd apps/sayit_app
          flutter precache --macos

      - name: Build macOS
        run: |
          cd apps/sayit_app
          flutter build macos --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin
          cp sayit-poc/target/release/sayit-poc apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/
          chmod +x apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/sayit-poc

      - name: Create ZIP
        run: |
          cd apps/sayit_app/build/macos/Build/Products/Release
          zip -r SayIt_macos.zip SayIt.app

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          files: apps/sayit_app/build/macos/Build/Products/Release/SayIt_macos.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Windows
        run: |
          cd apps/sayit_app
          flutter build windows --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p apps/sayit_app/build/windows/runner/Release/bin
          cp sayit-poc/target/release/sayit-poc.exe apps/sayit_app/build/windows/runner/Release/bin/

      - name: Create ZIP
        run: |
          cd apps/sayit_app/build/windows/runner/Release
          Compress-Archive -Path * -DestinationPath SayIt_windows.zip

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          files: apps/sayit_app/build/windows/runner/Release/SayIt_windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}
