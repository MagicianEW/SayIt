name: Release Builds

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  RUST_BACKTRACE: 1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Install macOS dependencies
        run: |
          cd apps/sayit_app
          flutter precache --macos

      - name: Build macOS
        run: |
          cd apps/sayit_app
          flutter build macos --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin
          cp sayit-poc/target/release/sayit-poc apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/
          chmod +x apps/sayit_app/build/macos/Build/Products/Release/SayIt.app/Contents/Resources/bin/sayit-poc

      - name: Create DMG
        run: |
          cd apps/sayit_app/build/macos/Build/Products/Release
          mkdir -p SayIt_dmg
          cp -R SayIt.app SayIt_dmg/
          brew install create-dmg
          create-dmg \
            --volname "SayIt" \
            --window-pos 200 120 \
            --hide-extension SayIt.app \
            "SayIt.dmg" \
            "SayIt_dmg/"

      - name: Upload to Release
        if: github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} apps/sayit_app/build/macos/Build/Products/Release/SayIt.dmg --clobber

      - name: Upload to Release (release trigger)
        if: github.event.inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} apps/sayit_app/build/macos/Build/Products/Release/SayIt.dmg --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: |
          cd sayit-poc
          cargo build --release

      - name: Build Windows
        run: |
          cd apps/sayit_app
          flutter build windows --release

      - name: Copy Rust binary to app
        run: |
          mkdir -p apps/sayit_app/build/windows/runner/Release/bin
          cp sayit-poc/target/release/sayit-poc.exe apps/sayit_app/build/windows/runner/Release/bin/

      - name: Create Inno Setup Script
        run: |
          $script = @'
          [Setup]
          AppName=SayIt
          AppVersion=0.1
          DefaultDirName={autopf}\SayIt
          OutputDir=.
          OutputBaseFilename=SayIt_setup
          Compression=lzma2
          [Files]
          Source="*";DestDir="{app}";Flags:recursesubdirs
          '@
          $script | Out-File -FilePath "apps/sayit_app/build/windows/runner/Release/sayit.iss" -Encoding UTF8

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" apps/sayit_app/build/windows/runner/Release/sayit.iss

      - name: Upload to Release
        if: github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} apps/sayit_app/build/windows/runner/Release/SayIt_setup.exe --clobber

      - name: Upload to Release (release trigger)
        if: github.event.inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} apps/sayit_app/build/windows/runner/Release/SayIt_setup.exe --clobber
